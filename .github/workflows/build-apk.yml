name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2 | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create debug.keystore"
            exit 1
          fi

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH"
            echo "Searching in app/build/outputs/apk/:"
            find app/build/outputs/apk -name "*.apk"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty."
            exit 1
          fi
          echo "APK verified successfully."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          mkdir -p release_staging
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | sed 's/[^a-zA-Z0-9._-]/_/g')
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release_staging/${ASSET_NAME}"
          echo "asset_path=release_staging/${ASSET_NAME}" >> $GITHUB_OUTPUT
          echo "asset_name=${ASSET_NAME}" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          SHA="${{ github.sha }}"
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Release asset missing."
            exit 1
          fi

          NOTES="### Build Information
          - This is an automatically generated debug APK.
          - The APK was built by GitHub Actions.
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** $SHA
          
          **Warning:**
          - The APK is intended for testing.
          - The APK is not a Play Store production release.
          - The APK is signed only with a temporary debug keystore."

          gh release create "$TAG" "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" == "success" ]; then
            TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url)
            echo "### ✅ Build and Release Success" >> $GITHUB_STEP_SUMMARY
            echo "The APK has been published to GitHub Releases." >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** $TAG" >> $GITHUB_STEP_SUMMARY
            echo "- **Download URL:** [View Release]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Asset Name:** ${{ steps.prep_asset.outputs.asset_name }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "You can download the APK directly from the 'Assets' section of the release page." >> $GITHUB_STEP_SUMMARY
            echo "The Actions artifact 'app-debug-apk' is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Build Success, Release Failed" >> $GITHUB_STEP_SUMMARY
            echo "The APK build and artifact upload were successful, but the GitHub Release could not be created." >> $GITHUB_STEP_SUMMARY
            echo "You can still download the APK from the GitHub Actions **Artifacts** section as **app-debug-apk**." >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.create_release.outcome }}" != "success" ]; then
               echo "::warning::GitHub Release publishing failed. Artifact remains available."
            fi
          fi
